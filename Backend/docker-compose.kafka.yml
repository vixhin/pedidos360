version: '3.8'

# ==============================================================================
# APACHE KAFKA (KRAFT) + KAFKA UI - PEDIDOS360 LOCAL OVERLAY
# ==============================================================================
# Uso básico:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
#
# Para levantar Kafka UI opcional:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml --profile kafka-ui up -d
# ==============================================================================

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: pedidos360-kafka
    restart: unless-stopped
    mem_limit: 1024m
    ports:
      # Listener externo disponible exclusivamente en localhost (127.0.0.1) para seguridad
      - "127.0.0.1:9094:9094"
      # El puerto interno 9092 NO se expone al host para evitar interferencias
    environment:
      # KRaft mode configuration (sin ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners internos y externos desacoplados
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker tuning
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Retención y gestión de segmentos
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      # Optimización de memoria (512MB heap inicial configurable)
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: pedidos360-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Provisioning Kafka topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pedidos360.pedidos.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pedidos360.pedidos.dlt.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
      echo 'Topics provisioned successfully.'
      "
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    ports:
      # Kafka UI expuesto únicamente en localhost (127.0.0.1)
      - "127.0.0.1:8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - kafka-ui

  # Overlays para conectar pedidos y analítica a Kafka
  pedidos:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy

  analitica:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
