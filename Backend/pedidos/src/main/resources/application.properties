spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=pedidos-service
server.port=8082

# ==============================================================================
# CONFIGURACIÓN APACHE KAFKA & TRANSACTIONAL OUTBOX
# ==============================================================================
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topics.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos360.pedidos.v1}
kafka.topics.pedidos-dlt=${KAFKA_TOPIC_PEDIDOS_DLT:pedidos360.pedidos.dlt.v1}
kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
kafka.outbox.poll-interval-ms=${KAFKA_OUTBOX_POLL_MS:2000}
