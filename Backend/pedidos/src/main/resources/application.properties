spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=pedidos-service
server.port=8082

# ==============================================================================
# CONFIGURACIÓN APACHE KAFKA & TRANSACTIONAL OUTBOX
# ==============================================================================
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topics.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos360.pedidos.v1}
kafka.topics.pedidos-dlt=${KAFKA_TOPIC_PEDIDOS_DLT:pedidos360.pedidos.dlt.v1}
kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}

# Parámetros del Worker Outbox y Resiliencia
kafka.outbox.poll-interval-ms=${KAFKA_OUTBOX_POLL_MS:2000}
kafka.outbox.batch-size=${KAFKA_OUTBOX_BATCH_SIZE:50}
kafka.outbox.timeout-seconds=${KAFKA_OUTBOX_TIMEOUT_SECONDS:5}
kafka.outbox.stuck-timeout-seconds=${KAFKA_OUTBOX_STUCK_TIMEOUT_SECONDS:300}
kafka.outbox.max-retries=${KAFKA_OUTBOX_MAX_RETRIES:5}
kafka.outbox.initial-backoff-ms=${KAFKA_OUTBOX_INITIAL_BACKOFF_MS:1000}
kafka.outbox.max-backoff-ms=${KAFKA_OUTBOX_MAX_BACKOFF_MS:60000}
