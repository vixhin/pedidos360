# ==============================================================================
# ENTORNO DE PRODUCCIÓN (PROD) - usuario-service
# ==============================================================================

# Base de Datos PostgreSQL (Variables obligatorias sin valores por defecto)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:usuario_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari optimizado para instancias económicas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate (Validación estricta de esquemas)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations (controladas, sin baseline automático en prod)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Clave Interna de Comunicación entre Microservicios (mínimo 32 caracteres)
bff.internal-key=${BFF_INTERNAL_KEY}

# Cloudflare Turnstile (estrictamente habilitado en prod)
turnstile.enabled=true
turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES}
turnstile.verify-action=true

# JWT Secret (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET}

# Configuración de Sesiones y Cookies (HTTPS obligatorio en PROD)
auth.cookie.secure=true
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.access-token-ttl=${ACCESS_TOKEN_TTL:PT15M}
auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:PT8H}

# Bootstrap administrativo (deshabilitado por defecto)
admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

# Manejo estricto de errores (sin stacktrace ni mensajes internos)
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator seguro (solo health expuesto)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# CORS
usuario.frontend-origin=${FRONTEND_ORIGIN}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
