# ==============================================================================
# ENTORNO DE DESARROLLO (DEV) - usuario-service
# ==============================================================================

# Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuario_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Clave Interna de Comunicación entre Microservicios
bff.internal-key=${BFF_INTERNAL_KEY:pedidos360-internal-secret-key-local-2026}

# Cloudflare Turnstile
turnstile.enabled=${TURNSTILE_ENABLED:true}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:0x4AAAAAAFusWYRuB8w2rXlYCVbHq7fZFN8}

# JWT Secret para desarrollo local (en prod se suministra JWT_SECRET obligatorio vía entorno)
jwt.secret=${JWT_SECRET:pedidos360_dev_secret_key_for_jwt_token_generation_local_environment_2026}

# CORS
usuario.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
