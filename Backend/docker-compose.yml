version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pedidos360-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pedidos360.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  usuario:
    build: ./usuario
    container_name: pedidos360-usuario
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usuario_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  pedidos:
    build: ./pedidos
    container_name: pedidos360-pedidos
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pedidos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  carrito:
    build: ./carrito
    container_name: pedidos360-carrito
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carrito_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  analitica:
    build: ./analitica
    container_name: pedidos360-analitica
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: analitica_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  productos:
    build: ./productos
    container_name: pedidos360-productos
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: productos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  notificacion:
    build: ./notificacion
    container_name: pedidos360-notificacion
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notificacion_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── BFF (Backend for Frontend) ────────────────────────────────────────────
  # Puerto: 8090
  # Valida JWT de Microsoft Entra ID y actúa como proxy hacia microservicios.
  #
  # Para configurar Azure, crea un archivo .env en la carpeta Backend/ con:
  #   AZURE_TENANT_ID=tu-tenant-id
  #   AZURE_API_CLIENT_ID=tu-api-client-id
  bff:
    build: ./bff
    container_name: pedidos360-bff
    restart: unless-stopped
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-PLACEHOLDER_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-PLACEHOLDER_API_CLIENT_ID}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # Nombres Docker de los microservicios (no localhost)
      USUARIO_SERVICE_URL: http://usuario:8081
      PEDIDOS_SERVICE_URL: http://pedidos:8082
      CARRITO_SERVICE_URL: http://carrito:8083
      ANALITICA_SERVICE_URL: http://analitica:8084
      PRODUCTOS_SERVICE_URL: http://productos:8085
      NOTIFICACION_SERVICE_URL: http://notificacion:8086
    ports:
      - "8090:8090"
    depends_on:
      - usuario
      - pedidos
      - carrito
      - analitica
      - productos
      - notificacion
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
