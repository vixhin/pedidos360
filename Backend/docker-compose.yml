version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pedidos360-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pedidos360.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
