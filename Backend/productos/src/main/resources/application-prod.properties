# ==============================================================================
# ENTORNO DE PRODUCCIÓN (PROD) - productos-service
# ==============================================================================

# Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:productos_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari optimizado
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Clave Interna de Comunicación entre Microservicios
bff.internal-key=${BFF_INTERNAL_KEY}

# JWT Secret para validación de tokens de usuario
jwt.secret=${JWT_SECRET}

# Manejo estricto de errores
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator seguro
management.endpoints.web.exposure.include=health

# CORS
productos.frontend-origin=${FRONTEND_ORIGIN}
