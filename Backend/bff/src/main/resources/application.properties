# ─── Aplicación ──────────────────────────────────────────────────────────────
spring.application.name=bff-service
server.port=8090

# ─── Microsoft Entra ID (Azure AD) ───────────────────────────────────────────
#
# IMPORTANTE: Reemplaza los valores PLACEHOLDER con los datos reales de Azure.
#
# AZURE_TENANT_ID   = Directory (tenant) ID del tenant de Microsoft Entra.
# AZURE_API_CLIENT_ID = Application (client) ID del App Registration de la API/BFF.
#
# En producción, inyectar vía variables de entorno del sistema o Docker.
# En desarrollo, reemplazar directamente o usar un application-local.properties.

# Issuer para la validación automática de Spring Security.
# Spring descarga el JWKS desde:
#   https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
# y valida automáticamente: firma RSA, issuer, exp, nbf
spring.security.oauth2.resourceserver.jwt.issuer-uri=\
  https://login.microsoftonline.com/${AZURE_TENANT_ID:PLACEHOLDER_TENANT_ID}/v2.0

# Audience esperada en el Access Token: api://<apiClientId>
# Usada por AudienceValidator.java (validación custom).
bff.azure.api-audience=api://${AZURE_API_CLIENT_ID:PLACEHOLDER_API_CLIENT_ID}

# ─── URLs de microservicios ───────────────────────────────────────────────────
#
# En desarrollo local: localhost con los puertos directos.
# En Docker:           nombres de los contenedores (usuario, pedidos, etc.)
#
# Variables disponibles:
#   USUARIO_SERVICE_URL       (default: http://localhost:8081)
#   PEDIDOS_SERVICE_URL       (default: http://localhost:8082)
#   CARRITO_SERVICE_URL       (default: http://localhost:8083)
#   ANALITICA_SERVICE_URL     (default: http://localhost:8084)
#   PRODUCTOS_SERVICE_URL     (default: http://localhost:8085)
#   NOTIFICACION_SERVICE_URL  (default: http://localhost:8086)

services.usuario-url=${USUARIO_SERVICE_URL:http://localhost:8081}
services.pedidos-url=${PEDIDOS_SERVICE_URL:http://localhost:8082}
services.carrito-url=${CARRITO_SERVICE_URL:http://localhost:8083}
services.analitica-url=${ANALITICA_SERVICE_URL:http://localhost:8084}
services.productos-url=${PRODUCTOS_SERVICE_URL:http://localhost:8085}
services.notificacion-url=${NOTIFICACION_SERVICE_URL:http://localhost:8086}

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Origen del frontend Angular.
# En producción, reemplazar con la URL real del frontend.
bff.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────────────────────
# Nunca loggear: Authorization header, access_token, id_token
logging.level.cl.duoc.pedidos360.bff=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.reactive.function.client=WARN
