# ==============================================================================
# ENTORNO DE DESARROLLO (DEV) - chat-service
# ==============================================================================

# Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS & Config
chat.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
chat.retention-days=${CHAT_RETENTION_DAYS:30}
chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:1000}
bff.internal-key=${BFF_INTERNAL_KEY:pedidos360-internal-secret-key-local-2026}
jwt.secret=${JWT_SECRET:pedidos360_dev_secret_key_for_jwt_token_generation_local_environment_2026}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
