# ==============================================================================
# ENTORNO DE PRODUCCIÓN (PROD) - chat-service
# ==============================================================================

# Base de Datos PostgreSQL (Obligatorias en Prod via ENV)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:chat_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Producción
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS & Seguridad Prod
chat.frontend-origin=${FRONTEND_ORIGIN}
chat.retention-days=${CHAT_RETENTION_DAYS:30}
chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:1000}
bff.internal-key=${BFF_INTERNAL_KEY}

# RabbitMQ Producción (Sin fallback guest)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ Listener Retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
