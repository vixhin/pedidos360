version: '3.8'

# ==============================================================================
# KAFKA CLUSTER CON ZOOKEEPER Y BROKERS MÚLTIPLES (PEDIDOS360)
# ==============================================================================
# Cumple los requisitos académicos del encargo DSY1107:
# 1. "El proyecto debe incluir un archivo docker-compose funcional para levantar una
#     arquitectura Kafka con Zookeeper y brokers."
# 2. "El proyecto debe incluir un archivo docker-compose funcional para levantar
#     Kafka-ui y permitir la administración de brokers y tópicos."
#
# Uso:
#   docker compose -f docker-compose.kafka-zookeeper.yml up -d
#
# Interfaz Web Kafka UI:
#   http://localhost:8089
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - kafka-zk-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - kafka-zk-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka2
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:29093,PLAINTEXT_HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29093,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - kafka-zk-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9095 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-zk-init-topics
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    networks:
      - kafka-zk-net
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creando tópicos con factor de replicación 2 en clúster ZK..."
        kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic pedidos360.pedidos.v1 --partitions 3 --replication-factor 2 --config retention.ms=86400000 --config cleanup.policy=delete
        kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic pedidos360.pedidos.dlt.v1 --partitions 3 --replication-factor 2 --config retention.ms=604800000 --config cleanup.policy=delete
        echo "Tópicos de clúster inicializados correctamente."
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-zk-ui
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-zk-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-zk-net
    depends_on:
      - kafka1
      - kafka2

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:

networks:
  kafka-zk-net:
    driver: bridge

