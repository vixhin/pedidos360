spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=analitica-service
server.port=8084

# ==============================================================================
# CONFIGURACIÓN APACHE KAFKA CONSUMER & TOPICS
# ==============================================================================
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:analitica-group}
spring.kafka.consumer.dlt-group-id=${KAFKA_DLT_CONSUMER_GROUP:analitica-dlt-group}
kafka.topics.pedidos=${KAFKA_TOPIC_PEDIDOS:pedidos360.pedidos.v1}
kafka.topics.pedidos-dlt=${KAFKA_TOPIC_PEDIDOS_DLT:pedidos360.pedidos.dlt.v1}
