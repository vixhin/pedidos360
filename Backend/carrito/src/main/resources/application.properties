spring.application.name=carrito
server.port=8083

# Configuración Principal de Base de Datos PostgreSQL / pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/carrito_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
