# SonarQube Community local para el análisis estático de Pedidos 360.
# Uso: docker compose -f sonar/docker-compose.yml up -d  -> http://localhost:9000
services:
  sonarqube:
    # Versión fijada para que todo el equipo obtenga los mismos resultados
    image: sonarqube:26.10.0.133078-community
    container_name: pedidos360-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
