# Configuración de SonarQube para Pedidos 360 (monorepo: 8 microservicios Java, frontend Angular, Terraform, Docker).
# Ejecutar con scripts/sonar-analysis.ps1, que compila, ejecuta pruebas (JaCoCo) y lanza el scanner.
sonar.projectKey=pedidos360
sonar.projectName=Pedidos 360
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=Backend,pedidos360-frontend/src,terraform
sonar.tests=Backend,pedidos360-frontend/src,pedidos360-frontend/e2e
sonar.test.inclusions=**/src/test/**,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/target/**,**/src/test/**,**/*.spec.ts,**/.mvn/**,**/mvnw*,**/.terraform/**,**/.angular/**,**/dist/**

# Java: bytecode, dependencias y cobertura generadas por Maven
sonar.java.source=21
sonar.java.binaries=Backend/*/target/classes
sonar.java.test.binaries=Backend/*/target/test-classes
sonar.java.libraries=Backend/*/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=Backend/*/target/site/jacoco/jacoco.xml

# Clases sin lógica de negocio (DTO, entidades, eventos, arranque) no cuentan para la cobertura
sonar.coverage.exclusions=**/dto/**,**/entity/**,**/event/**,**/*Application.java,pedidos360-frontend/**,terraform/**
