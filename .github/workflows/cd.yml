name: Pedidos360 Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev / prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  terraform-plan:
    name: Terraform Plan Execution (Local State Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (AWS Academy Compatible)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ github.event.inputs.environment }}
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform/environments/${{ github.event.inputs.environment }}
          terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR || '190.0.0.1/32' }}
        run: |
          cd terraform/environments/${{ github.event.inputs.environment }}
          terraform plan

      - name: State Notice
        run: |
          echo "=========================================================================="
          echo "NOTE: Terraform state is currently local (terraform.tfstate)."
          echo "terraform apply and terraform destroy are disabled in GitHub Actions."
          echo "Run apply locally from the developer workstation where state is maintained."
          echo "=========================================================================="
